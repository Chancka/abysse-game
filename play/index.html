<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- WEB-05: the page's address (with a sign-in's code, until the game cleans it) is never sent to another site. -->
  <meta name="referrer" content="same-origin">
  <title>Abysse</title>
  <link rel="icon" href="data:,">

  <!-- WEB-02: the page of the game in a browser, for computers. The colours are the palette's (Assets/Art/palette.json through
       Assets/UI/Theme/Theme.uss) and the words are Localization's (Own/Ui.csv, page.*): the build writes both in TemplateData/page.js
       (App/Editor/WebPageSetup.cs). -->
  <script src="TemplateData/page.js"></script>
  <style>
    /* The game's own fonts (copied beside the page by the build from Assets/UI/Fonts): square pixels, one font unit per pixel, 16 to the em. */
    @font-face { font-family: "game-title"; src: url("TemplateData/abysse-title.ttf") format("truetype"); }
    @font-face { font-family: "game-body"; src: url("TemplateData/abysse-body.ttf") format("truetype"); }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--pal-crypt-0); color: var(--pal-bone-6); }
    /* The canvas fills the window; its pixels are the screen's own (see fit() below), so nothing is smoothed. */
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: var(--pal-crypt-0);
      image-rendering: pixelated; }
    /* Rule 7 on the cover too: it is one small picture in game pixels (#art, drawn below), enlarged by a whole number of the screen's pixels.
       A browser smooths its own text (coloured fringes on Windows), so no text of the page is shown as text. */
    #cover { position: fixed; inset: 0; overflow: hidden; background: var(--pal-crypt-0); user-select: none; }
    #art { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
    #art { position: absolute; left: 0; top: 0; }
    #name, #version { display: none; } /* read by the drawing */
    #play { display: none; position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; outline: none; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="cover">
    <div id="name">Abysse</div>
    <div id="version">0.8.0</div>
    <canvas id="art" role="img"></canvas>
    <button id="play" type="button"></button>
  </div>
  <script>
    (function () {
      var all = window.pageTexts;
      var first = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
      var lang = first.indexOf('fr') === 0 ? 'fr' : 'en';
      var t = all[lang];
      document.documentElement.lang = lang;

      var canvas = document.getElementById('unity-canvas');
      var cover = document.getElementById('cover');
      var art = document.getElementById('art');
      var play = document.getElementById('play');
      play.textContent = t.play; // for a screen reader: the picture draws the word

      // The cover, drawn as the game draws: in game pixels with the game's fonts, each glyph on whole pixels and followed by its face's spacing
      // (the game's own rule: no spacing after a space), then enlarged by a whole number of the screen's pixels.
      var look = getComputedStyle(document.documentElement);
      function pal(name) { return look.getPropertyValue('--pal-' + name).trim(); }
      var TITLE = { family: 'game-title', spacing: 2 }, BODY = { family: 'game-body', spacing: 1 };
      var SPACES = ' \u00a0\u202f\u2009\u2007';
      var seen = { name: document.getElementById('name').textContent, version: document.getElementById('version').textContent,
        status: t.loading, bad: false, progress: 0, ready: false, hot: false, fonts: false };
      var pixel = 2; // the screen's pixels in one game pixel

      function step(ctx, ch, face, scale) { return Math.round(ctx.measureText(ch).width) + (SPACES.indexOf(ch) >= 0 ? 0 : face.spacing * scale); }
      function widthOf(ctx, text, face, scale) {
        ctx.font = (16 * scale) + 'px "' + face.family + '", Georgia, serif';
        var w = 0;
        for (var i = 0; i < text.length; i++) w += step(ctx, text[i], face, scale);
        return text.length && SPACES.indexOf(text[text.length - 1]) < 0 ? w - face.spacing * scale : w;
      }
      // Can the page read its own canvas back? (Some privacy modes scramble it: the text then stays as the browser draws it.)
      var exact = (function () {
        try {
          var c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
          c.width = c.height = 2;
          x.fillStyle = 'rgb(255, 0, 0)'; // a probe, never shown
          x.fillRect(0, 0, 2, 2);
          var d = x.getImageData(0, 0, 2, 2).data;
          for (var i = 0; i < 16; i += 4) if (d[i] !== 255 || d[i + 1] !== 0 || d[i + 2] !== 0 || d[i + 3] !== 255) return false;
          return true;
        } catch (e) { return false; }
      })();
      // A line of text as a small picture of whole pixels: each glyph sits on whole pixels, then every pixel is made the colour or nothing
      // (Windows softens the sides of a glyph even there). Kept: the cover is redrawn at every step of the loading.
      var pictures = {};
      function picture(text, face, scale, color) {
        var key = [face.family, scale, color, text].join('|');
        if (pictures[key]) return pictures[key];
        var c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
        var w = Math.max(1, widthOf(ctx, text, face, scale)), base = 15 * scale; // 15 rows above the baseline (capitals and their accents), 5 below
        c.width = w; c.height = 20 * scale; // (resets the context)
        ctx.font = (16 * scale) + 'px "' + face.family + '", Georgia, serif';
        ctx.fillStyle = color;
        ctx.textBaseline = 'alphabetic';
        for (var i = 0, x = 0; i < text.length; i++) {
          ctx.fillText(text[i], x, base);
          x += step(ctx, text[i], face, scale);
        }
        if (exact) {
          var all = ctx.getImageData(0, 0, c.width, c.height), d = all.data;
          ctx.fillRect(0, 0, 1, 1);
          var ink = ctx.getImageData(0, 0, 1, 1).data; // the colour's own bytes
          for (var j = 0; j < d.length; j += 4) { d[j] = ink[0]; d[j + 1] = ink[1]; d[j + 2] = ink[2]; d[j + 3] = d[j + 3] >= 128 ? 255 : 0; }
          ctx.putImageData(all, 0, 0);
        }
        return (pictures[key] = { canvas: c, width: w, base: base });
      }
      // One line centred on cx, its baseline on a whole pixel.
      function line(ctx, text, face, scale, cx, baseline, color) {
        var p = picture(text, face, scale, color);
        ctx.drawImage(p.canvas, Math.round(cx - p.width / 2), baseline - p.base);
      }
      function wrap(ctx, text, face, max) {
        var words = text.split(' '), lines = [], cur = '';
        for (var i = 0; i < words.length; i++) {
          var next = cur ? cur + ' ' + words[i] : words[i];
          if (cur && widthOf(ctx, next, face, 1) > max) { lines.push(cur); cur = words[i]; } else cur = next;
        }
        if (cur) lines.push(cur);
        return lines;
      }
      function box(ctx, x, y, w, h, edge, inside) {
        ctx.fillStyle = edge; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = inside; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      }
      function sized(c, w, h, r) { c.width = w; c.height = h; c.style.width = (w * pixel / r) + 'px'; c.style.height = (h * pixel / r) + 'px'; }

      function draw() {
        var r = window.devicePixelRatio || 1;
        var W = Math.round(window.innerWidth * r), H = Math.round(window.innerHeight * r); // the screen's pixels
        pixel = Math.max(2, Math.floor(H / 360));
        var w = Math.ceil(W / pixel), h = Math.ceil(H / pixel); // game pixels
        sized(art, w, h, r); // (also clears it)
        var ctx = art.getContext('2d');
        var cx = Math.floor(W / pixel / 2), top = Math.floor(H / pixel / 2) - 44, y = top + 54;
        if (seen.fonts) {
          line(ctx, seen.name, TITLE, 2, cx, top + 24, pal('bone-6'));
          line(ctx, seen.version, BODY, 1, cx, top + 42, pal('crypt-8'));
        }
        if (seen.ready) {
          var bw = widthOf(ctx, t.play, TITLE, 1) + 56, bh = 26, bx = cx - Math.round(bw / 2);
          box(ctx, bx, y, bw, bh, pal(seen.hot ? 'brass-5' : 'brass-4'), pal(seen.hot ? 'crypt-3' : 'crypt-2'));
          if (seen.fonts) line(ctx, t.play, TITLE, 1, cx, y + 19, pal('brass-6'));
          play.style.left = (bx * pixel / r) + 'px'; play.style.top = (y * pixel / r) + 'px';
          play.style.width = (bw * pixel / r) + 'px'; play.style.height = (bh * pixel / r) + 'px';
        } else {
          if (!seen.bad) {
            var barw = Math.min(200, w - 24), x0 = cx - Math.round(barw / 2);
            box(ctx, x0, y, barw, 7, pal('brass-3'), pal('crypt-2'));
            ctx.fillStyle = pal('brass-5'); ctx.fillRect(x0 + 1, y + 1, Math.round((barw - 2) * seen.progress), 5);
            y += 17;
          }
          if (seen.fonts) {
            var lines = wrap(ctx, seen.status, BODY, Math.min(320, w - 24));
            for (var i = 0; i < lines.length; i++) line(ctx, lines[i], BODY, 1, cx, y + 8 + 15 * i, pal(seen.bad ? 'bordeaux-5' : 'crypt-9'));
          }
        }
        art.setAttribute('aria-label', seen.ready ? seen.name : seen.status);
      }
      window.addEventListener('resize', draw);
      var fontsIn = function () { seen.fonts = true; draw(); };
      Promise.all([document.fonts.load('16px "game-title"'), document.fonts.load('16px "game-body"')]).then(fontsIn, fontsIn);
      play.onmouseenter = play.onfocus = function () { seen.hot = true; draw(); };
      play.onmouseleave = play.onblur = function () { seen.hot = false; draw(); };
      draw();

      function say(text, bad) {
        seen.status = text;
        seen.bad = !!bad;
        draw();
      }

      // A computer's version: a phone or a tablet is told so before anything is downloaded (the tab would need more than 1 GB).
      var ua = navigator.userAgent;
      // On the public site the old game's page is kept beside as legacy.html for phones (with a sign-in's answer, ?code=… or #…); a local build has none.
      if (/iPhone|iPod|iPad|Android|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
        var told = function () { say(t.phone, true); };
        fetch('legacy.html', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
          if (r.ok) location.replace('legacy.html' + location.search + location.hash); else told();
        }, told);
        return;
      }
      if (!document.createElement('canvas').getContext('webgl2')) { say(t.noWebgl2, true); return; }

      // Rule 7: the canvas holds exactly the screen's pixels under it (a density-2 screen, a zoom of 125 %), and the game enlarges its picture by a whole number in them.
      function fit(width, height) {
        if (width > 0 && height > 0 && (canvas.width !== width || canvas.height !== height)) { canvas.width = width; canvas.height = height; }
      }
      var observer = new ResizeObserver(function (entries) {
        var e = entries[0];
        if (e.devicePixelContentBoxSize) fit(e.devicePixelContentBoxSize[0].inlineSize, e.devicePixelContentBoxSize[0].blockSize);
        else { var r = window.devicePixelRatio || 1; fit(Math.round(e.contentRect.width * r), Math.round(e.contentRect.height * r)); }
      });
      try { observer.observe(canvas, { box: 'device-pixel-content-box' }); } catch (e) { observer.observe(canvas); }

      // The game's keys stay the game's: Space, the arrows and Tab neither scroll the page nor move its focus. (The full screen is the Settings': WebPage.jslib, WEB-08.)
      var keys = { Space: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Tab: 1, PageUp: 1, PageDown: 1, Home: 1, End: 1 };
      window.addEventListener('keydown', function (e) {
        var tag = e.target && e.target.tagName;
        if (keys[e.code] && tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
      });
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      var buildUrl = 'Build';
      var config = {
        arguments: [],
        dataUrl: buildUrl + '/play.data.unityweb',
        frameworkUrl: buildUrl + '/play.framework.js.unityweb',
        codeUrl: buildUrl + '/play.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "Chancka",
        productName: "Abysse",
        productVersion: "0.8.0",
        // The canvas is sized by fit() above, in the screen's own pixels.
        matchWebGLToCanvasSize: false,
        // The save (Application.persistentDataPath) reaches IndexedDB after every write: it outlives the page (WEB-01 §3).
        autoSyncPersistentDataPath: true,
        showBanner: function (message, type) {
          if (type === 'error') say(message, true);
          else console.warn(message);
        },
      };

      var script = document.createElement('script');
      script.src = buildUrl + '/play.loader.js';
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          seen.progress = progress;
          draw();
        }).then(function () {
          seen.ready = true;
          play.style.display = 'block';
          draw();
          play.focus();
        }).catch(function (message) {
          say(t.error.replace('{0}', message), true);
        });
      };
      document.body.appendChild(script);

      // The first click opens the sound (a browser plays none before) and shows the game.
      play.onclick = function () {
        cover.style.display = 'none';
        canvas.focus();
      };
    })();
  </script>
</body>
</html>
